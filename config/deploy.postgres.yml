# PostgreSQL destination overlay: kamal deploy -d postgres
#
# Deep-merged over config/deploy.yml. Requires one GitHub Action Secret, which
# .kamal/secrets.postgres reads from the environment and maps to both roles:
#
# - DB_PASSWORD (e.g. random-password)  - application login, and the cluster superuser
#                                         the postgres image initializes
#
# Note that Kamal deep-merges with array replacement, so any list redefined here
# replaces the base list rather than appending to it.

accessories:
  postgres:
    service: <%= ENV['SERVICE'] %>-postgres
    image: postgres:18-alpine
    host: <%= ENV['KAMAL_DEPLOY_IP'] %>
    env:
      clear:
        POSTGRES_USER: postgres
        POSTGRES_DB: postgres
      secret:
        - POSTGRES_PASSWORD
        - DB_PASSWORD
    files:
      - config/db/postgres/init.sh:/docker-entrypoint-initdb.d/10-next-saas.sh
    volumes:
      # PostgreSQL 18 stores its cluster below the versioned /var/lib/postgresql/18/docker
      # directory, so the persistent mount is /var/lib/postgresql, not .../data.
      - /opt/docker/<%= ENV['SERVICE'] %>/postgres-18:/var/lib/postgresql
