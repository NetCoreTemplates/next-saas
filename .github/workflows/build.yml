name: Build

on:
  pull_request: {}
  push:
    branches:
      - '**'        # matches every branch

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: next_saas_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d next_saas_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_CONNECTION: Host=127.0.0.1;Port=5432;Database=next_saas_tests;Username=postgres;Password=postgres
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: MyApp.Client/package-lock.json

      - name: Restore NuGet packages
        run: dotnet restore MyApp.slnx

      # If your feed requires authentication, enable and configure the step below.
      # This example uses a Personal Access Token stored in secrets.NUGET_API_KEY.
      # Alternatively, you can use the NuGet Authenticate action from Azure Pipelines.
      # - name: Authenticate private NuGet feed
      #   env:
      #     NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      #   run: |
      #     dotnet nuget add source "https://YOUR_FEED_URL/index.json" \
      #       --name "PrivateFeed" \
      #       --username "YOUR_USERNAME" \
      #       --password "$NUGET_API_KEY" \
      #       --store-password-in-clear-text

      - name: Install client dependencies
        run: npm ci
        working-directory: ./MyApp.Client

      - name: Build
        run: dotnet build MyApp.slnx --no-restore

      - name: Validate operational scripts
        run: bash -n scripts/*.sh

      - name: test
        run: dotnet test MyApp.slnx --no-build --no-restore

      - name: Client typecheck and tests
        run: npm run typecheck && npm run test:run
        working-directory: ./MyApp.Client

      - name: Static client export
        run: npm run build
        working-directory: ./MyApp.Client
