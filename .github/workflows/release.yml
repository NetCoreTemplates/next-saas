name: Release
permissions:
  packages: write
  contents: read
on:
  workflow_run:
    workflows: ["Build Container"]
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1
  SERVICESTACK_LICENSE: ${{ secrets.SERVICESTACK_LICENSE }}
  APPSETTINGS_JSON: ${{ secrets.APPSETTINGS_JSON }}
  KAMAL_DEPLOY_IP: ${{ secrets.KAMAL_DEPLOY_IP }}
  KAMAL_DEPLOY_HOST: ${{ secrets.KAMAL_DEPLOY_HOST }}
  KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
  KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  # Database provider, selected by the DB_PROVIDER repository variable (Settings > Secrets
  # and variables > Actions > Variables). Resolves a Kamal destination: config/deploy.<provider>.yml
  # is merged over config/deploy.yml, secrets come from .kamal/secrets-common plus
  # .kamal/secrets.<provider>, and config/db/<provider>/pre-deploy.sh runs before deploy.
  DB_PROVIDER: ${{ vars.DB_PROVIDER || 'sqlite' }}
  # Only consumed by the postgres provider; harmlessly empty for every other provider.
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  NEXT_SAAS_DB_PASSWORD: ${{ secrets.NEXT_SAAS_DB_PASSWORD }}

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Encode APPSETTINGS_JSON for runtime
        if: env.APPSETTINGS_JSON != ''
        run: |
          # Base64 encode to avoid shell/YAML quoting issues; keep as a single env var.
          b64=$(printf '%s' "$APPSETTINGS_JSON" | base64 -w0)
          echo "APPSETTINGS_JSON_BASE64=$b64" >> $GITHUB_ENV

      - name: Set up environment variables
        run: |
          echo "IMAGE=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "VERSION=${{ github.event.workflow_run.head_sha || github.sha }}" >> $GITHUB_ENV
          repo_name="$(echo ${{ github.repository }} | cut -d '/' -f 2)"
          echo "SERVICE=$(echo $repo_name | tr '[:upper:]' '[:lower:]' | tr '.' '-')" >> $GITHUB_ENV
          if find . -maxdepth 2 -type f -name "Configure.Db.Migrations.cs" | grep -q .; then
            echo "HAS_MIGRATIONS=true" >> $GITHUB_ENV
          else
            echo "HAS_MIGRATIONS=false" >> $GITHUB_ENV
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.0
          bundler-cache: true

      - name: Install Kamal
        run: gem install kamal -v 2.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:master

      - name: Verify database provider
        run: |
          if [ ! -f "config/deploy.$DB_PROVIDER.yml" ]; then
            echo "Unknown DB_PROVIDER '$DB_PROVIDER': config/deploy.$DB_PROVIDER.yml does not exist." >&2
            echo "Available providers:" >&2
            ls config/deploy.*.yml | sed 's|config/deploy\.\(.*\)\.yml|  \1|' >&2
            exit 1
          fi
          echo "Deploying with database provider '$DB_PROVIDER'"

      - name: Kamal bootstrap
        run: |
          kamal server bootstrap -d "$DB_PROVIDER"

      - name: Database provider pre-deploy hook
        run: |
          hook="config/db/$DB_PROVIDER/pre-deploy.sh"
          if [ -x "$hook" ]; then
            "$hook"
          else
            echo "No pre-deploy hook for '$DB_PROVIDER'; nothing to provision"
          fi

      - name: Ensure directories exist with correct permissions
        run: |
          echo "Creating directories with correct permissions"
          kamal server exec -d "$DB_PROVIDER" "mkdir -p /opt/docker/${{ env.SERVICE }}/App_Data /opt/docker/${{ env.SERVICE }}/initdb.d"

          echo "Setting app file permissions"
          kamal server exec -d "$DB_PROVIDER" "chown -R 1654:1654 /opt/docker/${{ env.SERVICE }}/App_Data /opt/docker/${{ env.SERVICE }}/initdb.d"

      - name: Verify file permissions before deploy
        run: |
          kamal server exec --no-interactive -d "$DB_PROVIDER" "chown -R 1654:1654 /opt/docker/${{ env.SERVICE }}/App_Data /opt/docker/${{ env.SERVICE }}/initdb.d"

      - name: Deploy with Kamal
        run: |
          kamal lock release -v -d "$DB_PROVIDER"
          kamal server exec --no-interactive -d "$DB_PROVIDER" 'echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin'
          kamal server exec --no-interactive -d "$DB_PROVIDER" 'docker pull ${{ env.IMAGE }}:${{ env.VERSION }}'
          kamal deploy -P -d "$DB_PROVIDER" --version "${{ env.VERSION }}"

      - name: Migration
        if: env.HAS_MIGRATIONS == 'true'
        run: |
          kamal app exec --no-reuse --no-interactive -d "$DB_PROVIDER" --version="${{ env.VERSION }}" "--AppTasks=migrate"

      - name: Verify production readiness
        run: curl --fail --show-error --silent --retry 12 --retry-delay 5 "https://${{ env.KAMAL_DEPLOY_HOST }}/ready"
